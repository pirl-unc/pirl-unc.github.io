name: Feed test (temporary)
on:
  push:
    branches: [papers-figures-and-feed-alert]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          #!/bin/bash
          # Same pinned curl image everywhere; print what it sends and what comes back.
          docker run --rm curlimages/curl:8.5.0 -sv -o /dev/null https://pirlblog.substack.com/feed 2>&1 \
            | grep -E "^\* (TLSv|ALPN|using HTTP)|^> (GET|Host|User-Agent|Accept)|^< (HTTP|server|cf-|content-type|set-cookie|x-)" | cut -c1-140
