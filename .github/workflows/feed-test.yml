name: Feed test (temporary)
on:
  push:
    branches: [papers-figures-and-feed-alert]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: probe
        shell: bash
        run: |
          echo "os=${{ matrix.os }} ip=$(curl -s https://api.ipify.org)"
          for i in 1 2 3; do curl -s -o /dev/null -w "curl-$i: %{http_code}\n" https://pirlblog.substack.com/feed; done
