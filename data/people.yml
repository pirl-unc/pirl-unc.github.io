# People page. Each group renders as a section in order.
#
# Fields per person:
#   name     - display name
#   role     - job title (omit for PIs)
#   photo    - filename under static/assets/people/ (downloaded by scripts/fetch_images.py)
#   photo_url- original Squarespace URL, used until the local file exists
#   links    - ordered list of {label: url}
#
# To add someone: copy a block, drop their photo in static/assets/people/,
# and set `photo` to the filename. `photo_url` is optional.

