title: Open Source Computational Tools
intro: Open-source software we build and maintain for cancer genomics and computational immunology.
featured:
- name: TCR-TRANSLATE
  url: https://github.com/dhuvik/tcr_translate
  image: assets/code/code-1.png
  description: "Generates antigen-specific T-cell receptor sequences, adapting methods from low-resource machine translation."
- name: LENS
  url: https://uselens.io
  image: assets/code/code-2.png
  description: "Tumor antigen prediction pipeline that curates tumor-specific MHC ligands from mutational and expression data."
- name: ACE
  url: https://github.com/pirl-unc/ace
  image: assets/code/code-3.png
  description: "Designs pooled ELISpot assays and deconvolves their readouts to find immunogenic peptides."
- name: MHCgnomes
  url: https://github.com/pirl-unc/mhcgnomes
  image: assets/code/code-4.png
  description: Parses and standardizes MHC allele names across species and the many naming
    schemes found in the wild.
- name: RAFT
  url: https://useraft.io
  image: assets/code/code-6.png
  description: "Reproducible Analyses Framework and Tools, for setting up and running reproducible Nextflow analyses."
- name: Exacto
  url: https://github.com/pirl-unc/exacto
  image: assets/code/code-5.png
  description: "Long-read toolkit that turns DNA and RNA variants into annotated mutant proteoforms and peptides."
# Lists under "More PIRL tools" and "OpenVax". `repo` must exist in
# github.com/<org> (it is skipped otherwise); `org` defaults to the PIRL org.
# `name` is the display name; it defaults to the repo name.
more_tools:
- title: Antigens and T-cell recognition
  items:
  - repo: presto
    name: Presto
    desc: Predicts peptide-MHC binding, antigen presentation and T-cell recognition with a single unified model.
  - repo: tsarina
    name: Tsarina
    desc: Selects shared cancer immunotherapy targets, such as cancer-testis antigens, viral antigens and recurrent mutations, for one patient or a population HLA panel.
  - repo: hitlist
    name: Hitlist
    desc: A curated store of MHC ligand, T-cell, mass spectrometry and expression evidence, traceable to its sources, for training immunology models.
  - repo: weirdo
    name: WEIRDO
    desc: Scores how foreign a peptide looks to the immune system by predicting which kinds of organisms have proteins that contain it.
  - repo: golfy
    name: Golfy
    desc: Designs pooled peptide experiments, such as combinatorial ELISpot epitope mapping, and deconvolves the results to identify the responding peptides.
- title: Tumor RNA and variants
  items:
  - repo: pirlygenes
    name: pirlygenes
    desc: Curated cancer gene sets and reference expression data that serve as the data layer for tumor RNA-seq analysis.
  - repo: trufflepig
    name: trufflepig
    desc: Analyzes tumor RNA-seq samples with the pirlygenes gene sets and produces plots and reports, from the command line or a web interface.
  - repo: vstol
    name: VSTOL
    desc: Converts small and structural DNA variants from VCF files into a standard table format, then annotates, compares and merges variant lists.
- title: Workflows and computing
  items:
  - repo: nexus
    name: Nexus
    desc: A command-line tool for running bioinformatics workflows written in Nextflow.
  - repo: raft-ui
    name: RAFT UI
    desc: Browser-based tools for creating RAFT manifests and configuration files and for viewing RAFT and LENS results.
  - repo: squid-tui
    name: Squid-TUI
    desc: A terminal dashboard for monitoring, organizing and cancelling Slurm jobs on a compute cluster.
  - repo: runplz
    name: runplz
    desc: A lightweight, Modal-style harness that runs a decorated Python function as a job on several compute backends.
openvax:
  url: https://openvax.org
  intro: PIRL maintains the <a href="https://openvax.org">OpenVax</a> tools for cancer immunogenomics and neoantigen vaccine design, including MHCgnomes above.
  groups:
  - title: MHC binding and alleles
    items:
    - repo: mhcflurry
      org: openvax
      name: MHCflurry
      desc: Predicts which peptides MHC class I molecules are likely to display, scoring binding affinity, antigen processing and overall presentation.
    - repo: mhctools
      org: openvax
      name: mhctools
      desc: One Python interface for running MHC binding, presentation and immunogenicity predictors such as NetMHCpan and MHCflurry.
    - repo: mhcseqs
      name: mhcseqs
      desc: Returns the curated protein sequence for an MHC allele name, split into signal peptide, peptide-binding groove and other structural domains.
  - title: Variants, RNA and gene annotation
    items:
    - repo: varcode
      org: openvax
      name: Varcode
      desc: Predicts how genomic variants from VCF or MAF files change genes, transcripts and proteins, including the resulting mutant protein sequence.
    - repo: isovar
      org: openvax
      name: Isovar
      desc: Assembles tumor RNA-seq reads around each somatic mutation to find the mutant protein sequence the tumor actually expresses.
    - repo: varlens
      org: openvax
      name: varlens
      desc: Command-line tools that combine, annotate and filter variants and pull supporting read evidence from BAM files into tables.
    - repo: pyensembl
      org: openvax
      name: PyEnsembl
      desc: Looks up genes, transcripts, exons and their sequences in a pinned Ensembl release or your own annotation files, with queries run locally.
    - repo: gtfparse
      org: openvax
      name: gtfparse
      desc: Reads GTF gene annotation files, such as those from Ensembl and GENCODE, into pandas tables and writes them back out.
  - title: Vaccine design
    items:
    - repo: vaxrank
      org: openvax
      name: Vaxrank
      desc: Selects and ranks mutated protein fragments for personalized therapeutic cancer vaccines from somatic variants, tumor RNA and the patient's HLA alleles.
    - repo: topiary
      org: openvax
      name: Topiary
      desc: Predicts which peptides from mutations or other antigen sources a patient's MHC molecules will present, then filters and ranks them.
    - repo: neoantigen-vaccine-pipeline
      org: openvax
      name: Neoantigen vaccine pipeline
      desc: The public version of the pipeline used to select patient-specific neoantigen vaccines in two phase I clinical trials.
  - title: Reference data
    items:
    - repo: oncoref
      name: oncoref
      desc: Curated cancer reference data, including cancer-type ontology, tumor mutational burden, incidence, immunotherapy response and tissue expression, behind one Python API.
    - repo: datacache
      org: openvax
      name: DataCache
      desc: Downloads a dataset once, verifies it and reuses the local copy, serving as the download layer for PyEnsembl and other OpenVax tools.
