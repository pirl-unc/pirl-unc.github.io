title: Open Source Computational Tools
intro: PIRL uses and creates a variety of computational tools for our work in genomics
  and computational immunology. Many of these tools are carried over from previous work
  by the <a href="https://github.com/Benjamin-Vincent-Lab">Vincent Lab at UNC</a>, and
  <a href="https://github.com/openvax">OpenVax</a>. Newer tools which are developed by
  PIRL will be listed below.
featured:
- name: TCR-TRANSLATE
  url: https://github.com/dhuvik/tcr_translate
  image: assets/code/code-1.png
  description: A sequence-to-sequence language model for antigen-specific TCR design that
    addresses data sparsity through techniques from low-resource machine translation.
- name: LENS
  url: https://uselens.io
  image: assets/code/code-2.png
  description: Tumor antigen prediction pipeline used to curate tumor-specific predicted
    MHC ligands from a variety of mutational and expression sources.
- name: ACE
  url: https://github.com/pirl-unc/ace
  image: assets/code/code-3.png
  description: Multiplex ELISpot assay design and deconvolution tool for determining epitope-specific
    T-cell responses from a large number of candidate peptides.
- name: MHCgnomes
  url: https://github.com/pirl-unc/mhcgnomes
  image: assets/code/code-4.png
  description: A tricky part of constructing large immunological datasets is dealing with
    the chaotic variability in naming of MHC molecules across species and within different
    research communities. MHCgnomes is a parser for MHC nomenclature which uses several
    reference data sources and a robust parsing strategy to standardize MHC nomenclature
    from a variety of different naming schemes you might encounter in the wild.
- name: RAFT
  url: https://github.com/pirl-unc/raft
  description: 'Reproducible Analyses Framework and Tools: infrastructure for configuring
    and running reproducible Nextflow analyses.'
- name: Exacto
  url: https://github.com/pirl-unc/exacto
  description: A long-read toolkit for mutant proteoform prediction that integrates DNA
    and RNA variants, assembles transcripts, and translates them into annotated proteoforms
    and mutant peptides.
# Short lists under "More PIRL tools" and "OpenVax". `repo` must exist in
# github.com/<org> (it is skipped otherwise); `org` defaults to the PIRL org.
more_tools:
- title: Immunology and antigen discovery
  items:
  - { repo: presto, desc: "All of T-cell:pMHC prediction in one model." }
  - { repo: tsarina, desc: "Tumor-specific antigen discovery: personalized immunotherapy targets from curated shared-antigen data." }
  - { repo: hitlist, desc: "Curated mass-spectrometry evidence for MHC ligands from IEDB and CEDAR." }
  - { repo: weirdo, desc: "Metrics of immunological foreignness for candidate T-cell epitopes." }
  - { repo: stig, desc: "Synthetic T-cell Informatics Generator." }
  - { repo: hf-tcr, desc: "HuggingFace scaffolding for TCR generation and evaluation." }
  - { repo: golfy, desc: "Heuristic solver for pooled peptide experiment design." }
- title: Reference data and expression
  items:
  - { repo: oncoref, desc: "Curated cancer reference data: ontology, TMB, incidence and mortality, expression." }
  - { repo: mhcseqs, desc: "MHC sequences." }
  - { repo: pirlygenes, desc: "Gene sets for cancer immunotherapy expression analysis." }
  - { repo: trufflepig, desc: "Step-by-step RNA tumor analysis driven by the pirlygenes gene sets." }
- title: Variants and long reads
  items:
  - { repo: variform, desc: "Variant isoform detection for large mutations in long-read RNA sequencing." }
  - { repo: vstol, desc: "Variant Standardization, Tabulation, and Operations Library." }
- title: Workflow and infrastructure
  items:
  - { repo: nexus, desc: "A command-line streamliner for Nextflow pipelines." }
  - { repo: raft-ui, desc: "Web interface for generating RAFT manifests and configuration files." }
  - { repo: squid-tui, desc: "Terminal dashboard for organizing and managing Slurm jobs." }
  - { repo: runplz, desc: "A tiny Modal-shaped job harness." }
openvax:
  url: https://openvax.org
  intro: PIRL maintains the <a href="https://openvax.org">OpenVax</a> tools for cancer
    immunogenomics and neoantigen vaccine design. They live in <a href="https://github.com/openvax">github.com/openvax</a>
    and in the PIRL organization.
  groups:
  - title: MHC binding prediction
    items:
    - { repo: mhcflurry, org: openvax, desc: "Peptide-MHC class I binding affinity prediction." }
    - { repo: mhc2flurry, org: openvax, desc: "MHC class II binding prediction (in development)." }
    - { repo: mhctools, org: openvax, desc: "Python interface to command-line and web MHC binding predictors." }
    - { repo: mhcnames, org: openvax, desc: "MHC allele naming in Python." }
    - { repo: mhcgnomes, desc: "Parsing MHC nomenclature in the wild (successor to mhcnames)." }
  - title: Variants and RNA
    items:
    - { repo: varcode, org: openvax, desc: "Manipulate genomic variants and predict their effects." }
    - { repo: isovar, org: openvax, desc: "Assemble RNA reads to determine the effect of a cancer mutation." }
    - { repo: varlens, org: openvax, desc: "Command-line manipulation of variants and NGS reads." }
    - { repo: pyensembl, org: openvax, desc: "Python interface to Ensembl reference genome annotations." }
    - { repo: gtfparse, org: openvax, desc: "Parsing tools for GTF files." }
  - title: Vaccine design
    items:
    - { repo: vaxrank, org: openvax, desc: "Ranked vaccine peptides for personalized cancer immunotherapy." }
    - { repo: topiary, org: openvax, desc: "Predict mutated T-cell epitopes from sequencing data." }
    - { repo: neoantigen-vaccine-pipeline, org: openvax, desc: "Pipeline for selecting patient-specific neoantigen vaccines." }
    - { repo: tsarina, desc: "Tumor-specific antigen discovery from curated shared-antigen data." }
  - title: Data and utilities
    items:
    - { repo: pepdata, org: openvax, desc: "Python interface to amino acid properties and IEDB." }
    - { repo: pepnet, org: openvax, desc: "Neural networks for amino acid sequences." }
    - { repo: datacache, org: openvax, desc: "Helpers for transparently downloading datasets." }
    - { repo: hitlist, desc: "Curated mass-spectrometry MHC ligand evidence." }
    - { repo: oncoref, desc: "Curated cancer reference data used across the OpenVax and PIRL libraries." }
