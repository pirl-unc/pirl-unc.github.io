<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
  <link rel="canonical" href="{{ site.url }}{% block canonical %}/{% endblock %}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ self.canonical() }}">
  <meta property="og:image" content="{{ absolute_url(asset(site.images.social_card.local, site.images.social_card.remote)) }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{{ asset(site.images.logo_mark.local, site.images.logo_mark.remote) }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} blog" href="{{ site.blog_feed }}">
  <link rel="stylesheet" href="{{ site_path('/fonts.css') }}">
  <script src="{{ appearance.adobe_font_loader }}" async onload="try{Typekit.load({async:true})}catch(e){}"></script>
  <link rel="stylesheet" href="{{ site_path('/site.css') }}">
  <script src="{{ site_path('/site.js') }}" defer></script>
</head>
<body class="page-{{ page }}">
  <a class="skip" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="{{ site_path('/') }}">
        <picture>
          <source media="(max-width: 799px), (pointer: coarse) and (max-width: 1024px)" srcset="{{ asset(site.images.logo_mark.local, site.images.logo_mark.remote) }}">
          <img src="{{ asset(site.images.logo_with_text.local, site.images.logo_with_text.remote) }}" alt="{{ site.name }}" fetchpriority="high">
        </picture>
      </a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="main-navigation" aria-label="Open navigation"><span></span><span></span></button>
      <nav id="main-navigation" class="nav" aria-label="Main">
        <ul>
          {% for item in site.nav %}
          <li>
            <a href="{{ site_path(item.href) }}"
               {% if item.page == page %}aria-current="page"{% endif %}
               {% if item.external %}rel="noopener"{% endif %}>{{ item.label }}</a>
          </li>
          {% endfor %}
        </ul>
        <ul class="social">
          <li><a href="{{ site.github_url }}" rel="noopener" aria-label="PIRL on GitHub">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
          </a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer wrap">
    <div class="footer-inner">
      <a href="{{ site.lineberger_url }}" rel="noopener"><img src="{{ asset(appearance.footer_logo) }}" alt="UNC Lineberger Comprehensive Cancer Center" width="1322" height="151" loading="lazy"></a>
    </div>
  </footer>
</body>
</html>
